    "README.md",
    "docs/**/*.rst",
    "docs/**/*.svg",
    "requirements.txt",
]
SPDX-FileCopyrightText = "David Schröder 2026"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
# Files where no license header can be placed:
